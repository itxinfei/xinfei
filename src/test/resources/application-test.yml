# 测试环境配置：连接本地 MySQL 开发库 xinfei（开发 / 测试共用单库）。
# 测试数据与演示数据通过「租户 + 命名空间」隔离，绝不互相清删：
#  - 演示数据挂在租户 1（页面默认展示），测试永不触碰；
#  - 自动化测试数据挂在租户 999（TenantTestExecutionListener 全局注入），
#    全局字典表用 test: / test_ 前缀（见 TestDatabaseCleaner）。
# 本环境不做整库 DROP / 重建；cleaner 只清测试租户 999 与 test 命名空间，测试可反复执行。
server:
  port: 8080
spring:
  # 测试环境关闭 Spring Session（任务 1 回归修复）：
  # application.yml 的 spring.session.store-type=redis 会使 SessionRepositoryFilter 包装请求，
  # MockMvc 的 .sessionAttr() 写在容器 mock session 上，经包装后 request.getSession() 走 Redis，
  # 读不到 mock session 属性 → AdminGuardAspect/TenantAspect 等取不到 employee/tenantId → "未登录"。
  # 测试无需 Redis 会话（MockMvc 自带 mock session），显式关闭恢复容器默认 HttpSession 行为。
  session:
    store-type: none
  # 测试环境关闭 Flyway：建表仍由各测试类的 @Sql + src/test/resources/schema*.sql 负责，
  # 启动期不做 DDL，避免与「租户 999 + test 命名空间」的 TestDatabaseCleaner 隔离机制相互干扰。
  # 夹具与 db/migration/V1 基线已核验结构一致（2026-10-16：129/129 表，列/索引/排序规则零漂移），
  # 改夹具后按 docs/FLYWAY_MIGRATION.md 第 7 节的配方重跑核验。
  flyway:
    enabled: false
  datasource:
    url: jdbc:mysql://192.168.20.88:3306/xinfei?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 60000
      connection-test-query: SELECT 1
  data:
    redis:
      host: 192.168.20.88
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
xinfei:
  payment:
    # 测试环境一律走 mock 渠道（工厂首行直接返回 mock Bean，不触数据库/网络），
    # 不依赖 application.yml 的默认值，保证支付相关测试零回归
    mock-mode: true
