<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑手评价管理 - 心飞外卖管理端</title>
  <link rel="stylesheet" href="../../styles/tokens.css?v=20260928" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260928" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: var(--el-bg-subtle); }
    html { overflow: hidden; }
    body { overflow-y: auto; }
    .container { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <main class="container" id="main-content" role="main" aria-labelledby="page-title">
    <h1 class="sr-only" id="page-title">骑手评价管理</h1>

    <el-card shadow="never">
      <!-- 修改点(2026-10-17)：迁移到 table-bar + crud-table + crud-dialog 共享层。
           此前裸 el-table + el-pagination 导致列表请求失败被渲染成"暂无数据"（误导）；
           现由 crud-table 监听 xinfei:list-fail 展示失败态+重试，分页/骨架复用组件内置能力 -->
      <table-bar
        :search-items="searchItems"
        :show-refresh="true"
        @search="onSearch"
        @reset="onReset"
        @refresh="load()"
      ></table-bar>

      <crud-table
        empty-hint="试试调整筛选条件"
        :data="rows"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="total"
        :show-actions="true"
        :actions-width="120"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-userName="{ row }">
          {{ row.anonymous === 1 ? '匿名' : (row.userName || '-') }}
        </template>
        <template #col-starRating="{ row }">
          <el-rate :value="row.starRating" disabled></el-rate>
        </template>
        <template #col-tags="{ row }">
          <el-tag v-for="t in (row.tagsParsed || [])" :key="t" size="mini" style="margin:2px;">{{ t }}</el-tag>
          <span v-if="!row.tagsParsed || !row.tagsParsed.length">-</span>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="statusTag(row.status)" size="small">{{ statusText(row.status) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <el-button v-if="!row.replyContent" type="text" size="small" class="btn-success"
                     @click="openReply(row)">回复</el-button>
          <span v-else class="el-text--secondary">已回复</span>
        </template>
      </crud-table>
    </el-card>

    <crud-dialog
      title="回复评价"
      :visible.sync="replyVisible"
      size="sm"
      :submit-loading="submitting"
      submit-text="确认回复"
      :before-close="beforeReplyClose"
      @submit="submitReply"
    >
      <p>骑手：{{ replyRow ? replyRow.riderName : '' }}　评分：{{ replyRow ? replyRow.starRating : '' }} 星</p>
      <el-form :model="replyForm" :rules="replyRules" ref="replyForm" label-width="70px" size="small">
        <el-form-item label="回复内容" prop="content">
          <el-input v-model="replyForm.content" type="textarea" :rows="3" placeholder="请输入回复内容"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </main>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260930"></script>
  <script src="../../js/common.js?v=20260928"></script>
  <script src="../../js/components.js?v=20261002"></script>
  <script>
    function parseTags(tags) {
      try { return tags ? JSON.parse(tags) : []; } catch (e) { return []; }
    }
    new Vue({
      el: '#main-content',
      data: function () {
        return {
          loading: false,
          rows: [],
          total: 0,
          page: 1,
          pageSize: 10,
          lastSearch: {},
          searchItems: [
            { type: 'input', field: 'riderName', placeholder: '骑手姓名', width: '160px' },
            { type: 'select', field: 'starRating', placeholder: '全部评分', width: '130px',
              options: [1, 2, 3, 4, 5].map(function (n) { return { label: n + ' 星', value: n } }) },
            { type: 'select', field: 'status', placeholder: '全部状态', width: '130px',
              options: [
                { label: '待审核', value: '0' },
                { label: '已通过', value: '1' },
                { label: '已拒绝', value: '2' }
              ] }
          ],
          columns: [
            { prop: 'id', label: '评价ID', width: 90 },
            { prop: 'riderName', label: '骑手', width: 110 },
            { prop: 'userName', label: '顾客', width: 110, slot: true },
            { prop: 'starRating', label: '评分', width: 160, slot: true },
            { prop: 'content', label: '评价内容', width: 180, formatter: function (v) { return v || '-' } },
            { prop: 'tags', label: '标签', width: 160, slot: true },
            { prop: 'status', label: '状态', width: 90, slot: true },
            { prop: 'createTime', label: '评价时间', width: 170 },
            { prop: 'replyContent', label: '商家回复', width: 160, formatter: function (v) { return v || '-' } }
          ],
          replyVisible: false,
          replyRow: null,
          replyForm: { content: '' },
          replyRules: {
            content: [{ required: true, message: '请输入回复内容', trigger: 'blur' }]
          },
          submitting: false
        };
      },
      mounted: function () {
        this.load();
      },
      methods: {
        load: function () {
          var vm = this;
          var s = vm.lastSearch || {};
          vm.loading = true;
          $axios.get('/api/rider-evaluation/admin/page', {
            params: {
              riderName: s.riderName || undefined,
              starRating: (s.starRating === '' || s.starRating == null) ? undefined : s.starRating,
              status: s.status || undefined,
              page: vm.page,
              pageSize: vm.pageSize
            }
          }).then(function (res) {
            var page = res.data || {};
            var records = page.records || [];
            for (var i = 0; i < records.length; i++) {
              records[i].tagsParsed = parseTags(records[i].tags);
            }
            vm.rows = records;
            vm.total = page.total || 0;
          }).catch(function () { /* 提示已统一；失败态由 crud-table 监听 xinfei:list-fail 展示 */ }).then(function () {
            vm.loading = false;
          });
        },
        onSearch: function (params) {
          this.lastSearch = params || {};
          this.page = 1;
          this.load();
        },
        onReset: function () {
          this.lastSearch = {};
          this.page = 1;
          this.load();
        },
        onPageChange: function (payload) {
          this.page = payload.page;
          this.load();
        },
        // 修改点：只更新状态不加载——crud-table 改页大小后会紧接着 emit page-change(page=1) 统一触发加载，
        // 若这里再 load 会发出两次相同请求
        onSizeChange: function (val) {
          this.pageSize = (typeof val === 'object' && val != null) ? (val.pageSize || val) : val;
          this.page = 1;
        },
        openReply: function (row) {
          this.replyRow = row;
          this.replyForm.content = '';
          this.replyVisible = true;
        },
        // 修改点：未保存守卫——回复内容未提交前阻止误关（X/ESC/取消按钮）
        beforeReplyClose: function () {
          return !this.replyForm.content;
        },
        submitReply: function () {
          var vm = this;
          vm.$refs.replyForm.validate(function (valid) {
            if (!valid) return;
            vm.submitting = true;
            $axios.put('/api/rider-evaluation/' + vm.replyRow.id + '/reply', {
              replyContent: vm.replyForm.content
            }).then(function () {
              vm.$message.success('回复成功');
              vm.replyForm.content = '';
              vm.replyVisible = false;
              vm.load();
            }).catch(function () { /* 提示已统一 */ }).then(function () {
              vm.submitting = false;
            });
          });
        },
        statusText: function (s) {
          if (s === 0) return '待审核';
          if (s === 1) return '已通过';
          if (s === 2) return '已拒绝';
          return s != null ? ('' + s) : '';
        },
        statusTag: function (s) {
          if (s === 0) return 'warning';
          if (s === 1) return 'success';
          if (s === 2) return 'danger';
          return 'info';
        }
      }
    });
  </script>
</body>
</html>
