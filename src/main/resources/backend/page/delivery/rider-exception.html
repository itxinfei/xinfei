<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑手异常工单 - 心飞外卖管理端</title>
  <link rel="stylesheet" href="../../styles/tokens.css?v=20260928" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260928" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: var(--el-bg-subtle); }
    html { overflow: hidden; }
    body { overflow-y: auto; }
    .container { padding: 24px 32px; max-width: 1500px; margin: 0 auto; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <main class="container" id="main-content" role="main" aria-labelledby="page-title">
    <h1 class="sr-only" id="page-title">骑手异常工单</h1>

    <el-card shadow="never">
      <!-- 修改点(2026-10-17)：迁移到 table-bar + crud-table + crud-dialog 共享层。
           此前裸 el-table + el-pagination 导致列表请求失败被渲染成"暂无数据"（误导）；
           现由 crud-table 监听 xinfei:list-fail 展示失败态+重试，分页/骨架复用组件内置能力 -->
      <table-bar
        :search-items="searchItems"
        :show-refresh="true"
        @search="onSearch"
        @reset="onReset"
        @refresh="load()"
      ></table-bar>

      <crud-table
        empty-hint="试试调整筛选条件"
        :data="rows"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="total"
        :show-actions="true"
        :actions-width="120"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-exceptionType="{ row }">
          <el-tag size="small" type="warning">{{ typeText(row.exceptionType) }}</el-tag>
        </template>
        <template #col-status="{ row }">
          <el-tag :type="statusTag(row.status)" size="small">{{ statusText(row.status) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <el-button v-if="row.status === 0" type="text" size="small" class="btn-success"
                     @click="openHandle(row)">处理</el-button>
          <span v-else class="el-text--secondary">已处理</span>
        </template>
      </crud-table>
    </el-card>

    <crud-dialog
      title="处理异常工单"
      :visible.sync="handleVisible"
      size="md"
      :submit-loading="submitting"
      submit-text="确认处理"
      :before-close="beforeHandleClose"
      @submit="submitHandle"
    >
      <el-form :model="handleForm" :rules="handleRules" ref="handleForm" label-width="90px" size="small">
        <el-form-item label="工单">
          <span>{{ handleRow ? (handleRow.orderNumber + ' · ' + typeText(handleRow.exceptionType)) : '' }}</span>
        </el-form-item>
        <el-form-item label="处理方式">
          <el-radio-group v-model="handleForm.action">
            <el-radio label="RESOLVE">标记已处理</el-radio>
            <el-radio label="CLOSE">关闭工单</el-radio>
            <el-radio label="REASSIGN">改派骑手</el-radio>
          </el-radio-group>
        </el-form-item>
        <el-form-item label="目标骑手" v-if="handleForm.action === 'REASSIGN'" prop="newRiderId">
          <el-select v-model="handleForm.newRiderId" placeholder="选择改派骑手" style="width: 100%;"
                     v-loading="ridersLoading">
            <el-option v-for="r in riders" :key="r.id"
                       :label="r.name + '（在途' + (r.currentOrderCount || 0) + '单·' + riderStatusText(r.status) + '）'"
                       :value="r.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="处理备注">
          <el-input v-model="handleForm.handleNote" type="textarea" :rows="3"
                    placeholder="填写处理说明（改派建议注明原因）"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </main>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260930"></script>
  <script src="../../js/common.js?v=20260928"></script>
  <script src="../../js/components.js?v=20261002"></script>
  <script>
    new Vue({
      el: '#main-content',
      data: function () {
        return {
          loading: false,
          rows: [],
          total: 0,
          page: 1,
          pageSize: 10,
          lastSearch: {},
          searchItems: [
            { type: 'select', field: 'status', placeholder: '全部状态', width: '140px',
              options: [
                { label: '待处理', value: 0 },
                { label: '已处理', value: 1 },
                { label: '已转单', value: 2 },
                { label: '已关闭', value: 3 }
              ] },
            { type: 'select', field: 'exceptionType', placeholder: '全部类型', width: '160px',
              options: [
                { label: '联系不上顾客', value: 1 },
                { label: '商品破损', value: 2 },
                { label: '地址有误', value: 3 },
                { label: '顾客拒收', value: 4 },
                { label: '申请转单', value: 5 },
                { label: '其他', value: 6 }
              ] },
            { type: 'input', field: 'orderNumber', placeholder: '订单号', width: '180px' }
          ],
          columns: [
            { prop: 'id', label: '工单ID', width: 90 },
            { prop: 'orderNumber', label: '订单号', width: 180 },
            { prop: 'riderName', label: '上报骑手', width: 110,
              formatter: function (v, row) { return v || ('#' + row.riderId) } },
            { prop: 'exceptionType', label: '异常类型', width: 130, slot: true },
            { prop: 'description', label: '异常描述', width: 180 },
            { prop: 'status', label: '状态', width: 100, slot: true },
            { prop: 'createTime', label: '上报时间', width: 170 },
            { prop: 'handleNote', label: '处理意见', width: 140, formatter: function (v) { return v || '-' } }
          ],
          handleVisible: false,
          handleRow: null,
          handleForm: { action: 'RESOLVE', newRiderId: null, handleNote: '' },
          handleRules: {
            newRiderId: [{ required: true, message: '请选择改派骑手', trigger: 'change' }]
          },
          riders: [],
          ridersLoading: false,
          submitting: false
        };
      },
      mounted: function () {
        this.load();
      },
      methods: {
        load: function () {
          var vm = this;
          var s = vm.lastSearch || {};
          vm.loading = true;
          $axios.get('/api/rider-exception/admin/page', {
            params: {
              status: (s.status === '' || s.status == null) ? undefined : s.status,
              exceptionType: (s.exceptionType === '' || s.exceptionType == null) ? undefined : s.exceptionType,
              orderNumber: s.orderNumber || undefined,
              page: vm.page,
              size: vm.pageSize
            }
          }).then(function (res) {
            var page = res.data || {};
            vm.rows = page.records || [];
            vm.total = page.total || 0;
          }).catch(function () { /* 提示已统一；失败态由 crud-table 监听 xinfei:list-fail 展示 */ }).then(function () {
            vm.loading = false;
          });
        },
        onSearch: function (params) {
          this.lastSearch = params || {};
          this.page = 1;
          this.load();
        },
        onReset: function () {
          this.lastSearch = {};
          this.page = 1;
          this.load();
        },
        onPageChange: function (payload) {
          this.page = payload.page;
          this.load();
        },
        // 修改点：只更新状态不加载——crud-table 改页大小后会紧接着 emit page-change(page=1) 统一触发加载
        onSizeChange: function (val) {
          this.pageSize = (typeof val === 'object' && val != null) ? (val.pageSize || val) : val;
          this.page = 1;
        },
        openHandle: function (row) {
          this.handleRow = row;
          this.handleForm = { action: 'RESOLVE', newRiderId: null, handleNote: '' };
          this.handleVisible = true;
          this.loadRiders();
        },
        loadRiders: function () {
          var vm = this;
          if (vm.riders.length) { return; }
          vm.ridersLoading = true;
          $axios.get('/api/delivery/rider/page', { params: { page: 1, pageSize: 100 } })
            .then(function (res) {
              var page = res.data || {};
              vm.riders = page.records || [];
            }).catch(function () { /* 提示已统一 */ }).then(function () {
              vm.ridersLoading = false;
            });
        },
        // 修改点：未保存守卫——已填写处理方式/备注但未提交前阻止误关（X/ESC/取消按钮）
        beforeHandleClose: function () {
          var f = this.handleForm;
          return !(f.handleNote || f.newRiderId || f.action !== 'RESOLVE');
        },
        submitHandle: function () {
          var vm = this;
          vm.$refs.handleForm.validate(function (valid) {
            if (!valid) return;
            vm.submitting = true;
            $axios.put('/api/rider-exception/' + vm.handleRow.id + '/handle', {
              action: vm.handleForm.action,
              handleNote: vm.handleForm.handleNote,
              newRiderId: vm.handleForm.action === 'REASSIGN' ? vm.handleForm.newRiderId : null
            }).then(function () {
              vm.$message.success('处理完成');
              vm.handleVisible = false;
              vm.load();
            }).catch(function () { /* 提示已统一 */ }).then(function () {
              vm.submitting = false;
            });
          });
        },
        typeText: function (t) {
          var map = { 1: '联系不上顾客', 2: '商品破损', 3: '地址有误', 4: '顾客拒收', 5: '申请转单', 6: '其他' };
          return map[t] || '异常';
        },
        statusText: function (s) {
          var map = { 0: '待处理', 1: '已处理', 2: '已转单', 3: '已关闭' };
          return map[s] || '未知';
        },
        statusTag: function (s) {
          switch (s) {
            case 0: return 'warning';
            case 1: return 'success';
            case 2: return 'primary';
            default: return 'info';
          }
        },
        riderStatusText: function (s) {
          var map = { 0: '离线', 1: '在线', 2: '忙碌' };
          return map[s] || '';
        }
      }
    });
  </script>
</body>
</html>
