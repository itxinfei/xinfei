<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑手提现审核 - 心飞外卖管理端</title>
  <link rel="stylesheet" href="../../styles/tokens.css?v=20260928" />
  <link rel="stylesheet" href="../../styles/main.css?v=20260928" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: var(--el-bg-subtle); }
    html { overflow: hidden; }
    body { overflow-y: auto; }
    .container { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>
  <main class="container" id="main-content" role="main" aria-labelledby="page-title">
    <h1 class="sr-only" id="page-title">骑手提现审核</h1>

    <el-card shadow="never">
      <!-- 修改点(2026-10-17)：迁移到 table-bar + crud-table + crud-dialog 共享层。
           此前裸 el-table + el-pagination 导致列表请求失败被渲染成"暂无数据"（误导）；
           现由 crud-table 监听 xinfei:list-fail 展示失败态+重试，分页/骨架复用组件内置能力 -->
      <table-bar
        :search-items="searchItems"
        :show-refresh="true"
        @search="onSearch"
        @reset="onReset"
        @refresh="load()"
      ></table-bar>

      <crud-table
        empty-hint="试试调整筛选条件"
        :data="rows"
        :columns="columns"
        :loading="loading"
        :page="page"
        :page-size="pageSize"
        :total="total"
        :show-actions="true"
        :actions-width="120"
        :actions-fixed="true"
        @page-change="onPageChange"
        @size-change="onSizeChange"
      >
        <template #col-status="{ row }">
          <el-tag :type="statusTag(row.status)" size="small">{{ statusText(row.status) }}</el-tag>
        </template>
        <template #actions="{ row }">
          <el-button v-if="row.status === 'PENDING'" type="text" size="small" class="btn-success"
                     @click="openReview(row, true)">通过</el-button>
          <el-button v-if="row.status === 'PENDING'" type="text" size="small"
                     class="btn-delete" @click="openReview(row, false)">驳回</el-button>
          <span v-if="row.status !== 'PENDING'" class="el-text--secondary">已处理</span>
        </template>
      </crud-table>
    </el-card>

    <crud-dialog
      :title="reviewApprove ? '通过提现' : '驳回提现'"
      :visible.sync="reviewVisible"
      size="sm"
      :submit-loading="submitting"
      :submit-text="reviewApprove ? '确认通过' : '确认驳回'"
      :before-close="beforeReviewClose"
      @submit="submitReview"
    >
      <p>申请ID：{{ reviewRow ? reviewRow.id : '' }}　金额：¥{{ reviewRow ? formatMoney(reviewRow.amount) : '0.00' }}</p>
      <el-form :model="reviewForm" :rules="reviewRules" ref="reviewForm" label-width="70px" size="small">
        <el-form-item label="审核备注" prop="remark">
          <el-input v-model="reviewForm.remark" type="textarea" :rows="3" placeholder="审核备注（驳回建议填写原因）"></el-input>
        </el-form-item>
      </el-form>
    </crud-dialog>
  </main>

  <script src="../../plugins/vue/vue.js"></script>
  <script src="../../plugins/element-ui/index.js?v=20260915"></script>
  <script src="../../plugins/axios/axios.min.js"></script>
  <script src="../../js/request.js?v=20260930"></script>
  <script src="../../js/common.js?v=20260928"></script>
  <script src="../../js/components.js?v=20261002"></script>
  <script>
    function fmt(v) {
      if (v == null) return '0.00';
      return Number(v).toFixed(2);
    }
    new Vue({
      el: '#main-content',
      data: function () {
        return {
          loading: false,
          rows: [],
          total: 0,
          page: 1,
          pageSize: 10,
          lastSearch: {},
          searchItems: [
            { type: 'select', field: 'status', placeholder: '全部状态', width: '160px',
              options: [
                { label: '待审核', value: 'PENDING' },
                { label: '已通过', value: 'APPROVED' },
                { label: '已驳回', value: 'REJECTED' }
              ] }
          ],
          columns: [
            { prop: 'id', label: '申请ID', width: 90 },
            { prop: 'riderId', label: '骑手ID', width: 100 },
            { prop: 'amount', label: '提现金额', width: 120, type: 'money' },
            { prop: 'status', label: '状态', width: 100, slot: true },
            { prop: 'applyTime', label: '申请时间', width: 170 },
            { prop: 'reviewTime', label: '审核时间', width: 170, formatter: function (v) { return v || '-' } },
            { prop: 'remark', label: '备注', width: 140 }
          ],
          reviewVisible: false,
          reviewRow: null,
          reviewApprove: true,
          reviewForm: { remark: '' },
          submitting: false
        };
      },
      computed: {
        // 修改点：驳回时备注必填——校验规则随审核动作动态生效，字段级报错（原为顶部 toast）
        reviewRules: function () {
          var vm = this;
          return {
            remark: [{
              validator: function (rule, value, callback) {
                if (!vm.reviewApprove && !value) {
                  callback(new Error('驳回请填写原因'));
                } else {
                  callback();
                }
              },
              trigger: 'blur'
            }]
          };
        }
      },
      mounted: function () {
        this.load();
      },
      methods: {
        load: function () {
          var vm = this;
          var s = vm.lastSearch || {};
          vm.loading = true;
          $axios.get('/api/delivery/rider-withdrawal/page', {
            params: { status: s.status || undefined, page: vm.page, size: vm.pageSize }
          }).then(function (res) {
            var page = res.data || {};
            vm.rows = page.records || [];
            vm.total = page.total || 0;
          }).catch(function () { /* 提示已统一；失败态由 crud-table 监听 xinfei:list-fail 展示 */ }).then(function () {
            vm.loading = false;
          });
        },
        onSearch: function (params) {
          this.lastSearch = params || {};
          this.page = 1;
          this.load();
        },
        onReset: function () {
          this.lastSearch = {};
          this.page = 1;
          this.load();
        },
        onPageChange: function (payload) {
          this.page = payload.page;
          this.load();
        },
        // 修改点：只更新状态不加载——crud-table 改页大小后会紧接着 emit page-change(page=1) 统一触发加载
        onSizeChange: function (val) {
          this.pageSize = (typeof val === 'object' && val != null) ? (val.pageSize || val) : val;
          this.page = 1;
        },
        openReview: function (row, approve) {
          this.reviewRow = row;
          this.reviewApprove = approve;
          this.reviewForm.remark = '';
          this.reviewVisible = true;
        },
        // 修改点：未保存守卫——已填备注未提交前阻止误关（X/ESC/取消按钮）
        beforeReviewClose: function () {
          return !this.reviewForm.remark;
        },
        submitReview: function () {
          var vm = this;
          vm.$refs.reviewForm.validate(function (valid) {
            if (!valid) return;
            vm.submitting = true;
            $axios.post('/api/delivery/rider-withdrawal/' + vm.reviewRow.id + '/review', null, {
              params: { approve: vm.reviewApprove, remark: vm.reviewForm.remark }
            }).then(function () {
              vm.$message.success('审核完成');
              vm.reviewForm.remark = '';
              vm.reviewVisible = false;
              vm.load();
            }).catch(function () { /* 提示已统一 */ }).then(function () {
              vm.submitting = false;
            });
          });
        },
        formatMoney: fmt,
        statusText: function (s) {
          if (s === 'PENDING') return '待审核';
          if (s === 'APPROVED') return '已通过';
          if (s === 'REJECTED') return '已驳回';
          return s || '';
        },
        statusTag: function (s) {
          if (s === 'PENDING') return 'warning';
          if (s === 'APPROVED') return 'success';
          if (s === 'REJECTED') return 'danger';
          return 'info';
        }
      }
    });
  </script>
</body>
</html>
