# Xinfei 外卖系统 — 一键部署（MySQL 8 + Redis 7 + 应用）
# 首次启动：db-init 容器自动建表 + 导入最小种子数据（admin / 123456）
# 可调参数：MYSQL_ROOT_PASSWORD（必填，须在 .env 设置，缺值 compose 直接报错，不再用仓库默认口令）
#            可选：APP_PORT / XINFEI_SERVER_URL / XINFEI_*_MOCKMODE / ALLOW_MOCK_IN_PROD
services:
  mysql:
    image: mysql:8.0
    container_name: xinfei-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD（勿用仓库默认口令）}
      MYSQL_DATABASE: xinfei
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: xinfei-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 一次性建库 + 导入 schema（幂等，每次 up 都会跑一遍，不丢数据）
  db-init:
    image: mysql:8.0
    container_name: xinfei-db-init
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD（勿用仓库默认口令）}
    volumes:
      - ./docker/db-init.sh:/db-init.sh:ro
      - ./src/test/resources:/schemas:ro
      - ./db:/seed:ro
    entrypoint: ["bash", "/db-init.sh"]

  app:
    build: .
    container_name: xinfei-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # application-prod.yml 已外部化的数据源 / Redis
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: xinfei
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD（勿用仓库默认口令）}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 上传根目录（图片/发票等落盘到持久卷）
      XINFEI_PATH: /data/uploads
      # 堂食二维码等对外链接：手机访问请改成宿主机局域网 IP，如 http://192.168.1.10:8080
      XINFEI_SERVERURL: ${XINFEI_SERVER_URL:-http://localhost:8080}
      # 首启无商户密钥，默认 mock 保证可用；接真实微信/支付宝后再关（false 走真实验签，fail-closed）
      XINFEI_PAYMENT_MOCKMODE: ${XINFEI_PAYMENT_MOCKMODE:-true}
      # 显式豁免「prod 与支付 mock 互斥」校验，仅限隔离演示 / 单机自部署；
      # 对公网提供服务的真实生产环境务必在 .env 设为 false（同时把 XINFEI_PAYMENT_MOCKMODE 设为 false）
      ALLOW_MOCK_IN_PROD: ${ALLOW_MOCK_IN_PROD:-true}
      # 无短信模板配置，mock 模式验证码只打日志，保证顾客端可登录
      XINFEI_SMS_MOCKMODE: ${XINFEI_SMS_MOCKMODE:-true}
      XINFEI_PUSH_MOCKMODE: ${XINFEI_PUSH_MOCKMODE:-true}
      XINFEI_DELIVERY_MOCKMODE: ${XINFEI_DELIVERY_MOCKMODE:-true}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -Duser.timezone=Asia/Shanghai}
    volumes:
      - app-uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  mysql-data:
  redis-data:
  app-uploads:
